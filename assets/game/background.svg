<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a66"/>
      <stop offset=".6" stop-color="#4a4f9c"/>
      <stop offset="1" stop-color="#e88aa0"/>
    </linearGradient>
    <!-- casillas del tablero: 70x100 empezando en (160, 80) -->
    <pattern id="moss" x="160" y="80" width="140" height="200" patternUnits="userSpaceOnUse">
      <rect width="140" height="200" fill="#3f8f4a"/>
      <rect width="70" height="100" fill="#4b9e52"/>
      <rect x="70" y="100" width="70" height="100" fill="#4b9e52"/>
      <path d="M18 72q2-7 4 0M23 72q2-6 4 0M92 28q2-7 4 0M97 28q2-6 4 0M112 172q2-7 4 0M117 172q2-6 4 0M40 138q2-7 4 0M45 138q2-6 4 0" fill="none" stroke="#2f7a3c" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="50" cy="30" rx="3" ry="2" fill="#f7b6c8"/>
      <ellipse cx="120" cy="70" rx="3" ry="2" fill="#f7b6c8"/>
      <ellipse cx="20" cy="175" rx="3" ry="2" fill="#f7b6c8"/>
      <ellipse cx="88" cy="130" rx="3" ry="2" fill="#f7b6c8"/>
    </pattern>
    <pattern id="lattice" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#6e1f1c"/>
      <path d="M0 0H28M0 0V28" stroke="#571513" stroke-width="3"/>
    </pattern>
    <!-- de aquí salen los enemigos -->
    <linearGradient id="gloom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a0b2e" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0b2e" stop-opacity=".6"/>
    </linearGradient>
  </defs>

  <!-- cielo y horizonte (detrás de la barra superior) -->
  <rect width="800" height="82" fill="url(#sky)"/>
  <g fill="#fff" opacity=".8">
    <circle cx="240" cy="12" r="1.200"/><circle cx="420" cy="24" r="1.200"/><circle cx="625" cy="10" r="1.200"/><circle cx="700" cy="22" r="1"/><circle cx="330" cy="8" r="1"/>
  </g>
  <path d="M170 82l70-24 50 12 90-40 45 18 55-14 80 30 70-16 70 34Z" fill="#3a3478"/>
  <path d="M380 30l-20 10 12-2 8 5 9-4 8 4 3-4 10 2Z" fill="#f4eefb"/>
  <path d="M160 82l90-14 110 10 130-12 120 12 190-12v16Z" fill="#2c6b45"/>

  <!-- árboles de cerezo -->
  <g>
    <path d="M452 82l3-22 5 0 2 22Z" fill="#4a2a1e"/>
    <circle cx="444" cy="58" r="12" fill="#e77fa3"/><circle cx="458" cy="50" r="14" fill="#f29ab8"/><circle cx="472" cy="60" r="12" fill="#e77fa3"/>
  </g>

  <!-- torii lejano -->
  <g fill="#d13b24" stroke="#5a140c" stroke-width="1.500">
    <rect x="650" y="50" width="6" height="32"/><rect x="684" y="50" width="6" height="32"/>
    <path d="M640 42q30 6 60 0l-2 7q-28 4-56 0Z"/>
    <rect x="646" y="53" width="48" height="4"/>
  </g>

  <!-- suelo: musgo por casillas y grava en los bordes -->
  <rect y="78" width="800" height="522" fill="#b9ad93"/>
  <rect x="160" y="80" width="630" height="500" fill="url(#moss)"/>
  <rect x="160" y="80" width="630" height="4" fill="#2f7a3c" opacity=".6"/>
  <g fill="#8f846e">
    <ellipse cx="200" cy="590" rx="14" ry="5"/><ellipse cx="350" cy="592" rx="10" ry="4"/><ellipse cx="520" cy="589" rx="16" ry="5"/><ellipse cx="690" cy="592" rx="11" ry="4"/>
  </g>
  <rect x="640" y="78" width="160" height="522" fill="url(#gloom)"/>

  <!-- templo del Dios Yokai (detrás del selector) -->
  <rect x="0" y="70" width="158" height="510" fill="url(#lattice)"/>
  <rect x="0" y="70" width="10" height="510" fill="#c8351f" stroke="#3f0f0a" stroke-width="2"/>
  <rect x="148" y="70" width="10" height="510" fill="#c8351f" stroke="#3f0f0a" stroke-width="2"/>
  <path d="M0 8h126q10 30 48 54l-8 18H0Z" fill="#23283f" stroke="#0d1020" stroke-width="3" stroke-linejoin="round"/>
  <path d="M0 62h170M0 44h140M0 26h126" stroke="#3b4264" stroke-width="3" fill="none"/>
  <rect x="104" y="45" width="34" height="32" rx="2" fill="#3a2315" stroke="#e0b24a" stroke-width="2"/>
  <text x="121" y="70" font-size="24" text-anchor="middle" fill="#ffd869" font-family="Yu Mincho, MS Mincho, Noto Serif CJK JP, serif">神</text>
  <path d="M0 580h170v6H0ZM0 586h178v6H0ZM0 592h186v8H0Z" fill="#a39a85" stroke="#6e6653" stroke-width="1"/>
</svg>
